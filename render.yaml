services:
  - type: web
    name: mesa-viva
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run db:seed && npm run start -- --hostname 0.0.0.0
    healthCheckPath: /staff/login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: mesa-viva
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: mesa-viva-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_WAITER_PASSWORD
        generateValue: true

databases:
  - name: mesa-viva-db
    plan: free
    region: virginia
    databaseName: mesa_viva
    user: mesa_viva
    ipAllowList: []
